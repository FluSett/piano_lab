services:
  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - PORT=${PORT:-8080}
      - AI_ENGINE_URL=http://ai-engine:8000
      - RATE_LIMIT_RPS=${RATE_LIMIT_RPS:-100}
      - WORKER_POOL_SIZE=${WORKER_POOL_SIZE:-10}
    depends_on:
      - ai-engine

  ai-engine:
    build:
      context: ./services/ai-engine
      dockerfile: Dockerfile
    ports:
      - "${AI_PORT:-8000}:8000"
    environment:
      - PORT=${AI_PORT:-8000}
      - PROCESS_POOL_WORKERS=${PROCESS_POOL_WORKERS:-4}
      - DEVICE=${DEVICE:-cpu}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}

  frontend:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://localhost:8080/api/v1/ws}
      - NEXT_TELEMETRY_DISABLED=${NEXT_TELEMETRY_DISABLED:-1}
    depends_on:
      - api-gateway
