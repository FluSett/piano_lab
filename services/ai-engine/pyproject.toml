[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "piano-lab-ai-engine"
version = "1.0.0"
description = "Piano Lab AI Engine for Audio AMT Transcription, Sequence Alignment & Coach Logic"
authors = [{ name = "Piano Lab Team" }]
requires-python = ">=3.13"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.13"
mypy_path = ["src", "."]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
strict = true

[tool.pytest.ini_options]
filterwarnings = [
    # Third-party Starlette testclient deprecation
    "ignore:.*starlette.testclient.*"
]

[tool.pyrefly]
search_path = [".", "src"]
search-path = [".", "src"]
exclude = [
    "*__pyrefly_virtual__*",
    "**/*__pyrefly_virtual__*",
    "*inmemory*",
    "**/*inmemory*",
    "**/*.md"
]
